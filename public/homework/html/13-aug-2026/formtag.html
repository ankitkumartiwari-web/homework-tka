<!DOCTYPE html>
<html lang="en">

<head>
    <title>User Registration Page</title>
</head>

<body>

    <center>

        <h1>User Registration Page for Job</h1>

        <hr>

        <form action="" method="get">

            <table border="1" cellpadding="10" cellspacing="5">

                <tr>
                    <td>
                        <label for="username">Username:</label>
                    </td>

                    <td>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your name">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="address">Address:</label>
                    </td>

                    <td>
                        <textarea
                            id="address"
                            name="address"
                            rows="5"
                            cols="25"
                            placeholder="Enter your address"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>
                        Gender:
                    </td>

                    <td>
                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Male">

                        <label for="male">Male</label>

                        <br>

                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Female">

                        <label for="female">Female</label>

                        <br>

                        <input
                            type="radio"
                            id="other"
                            name="gender"
                            value="Other">

                        <label for="other">Other</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        Skills:
                    </td>

                    <td>
                        <input
                            type="checkbox"
                            id="python"
                            name="python"
                            value="Python">

                        <label for="python">Python</label>

                        <br>

                        <input
                            type="checkbox"
                            id="html"
                            name="html"
                            value="HTML">

                        <label for="html">HTML</label>

                        <br>

                        <input
                            type="checkbox"
                            id="da"
                            name="da"
                            value="DA">

                        <label for="da">DA</label>

                        <br>

                        <input
                            type="checkbox"
                            id="ds"
                            name="ds"
                            value="DS">

                        <label for="ds">DS</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="country">Country:</label>
                    </td>

                    <td>
                        <select
                            id="country"
                            name="country">

                            <option value="india">INDIA</option>
                            <option value="us">US</option>
                            <option value="uk">UK</option>
                            <option value="france">France</option>
                            <option value="germany">Germany</option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">

                        <center>
                            <button type="submit">
                                Register
                            </button>
                        </center>

                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>

</html>
